name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-tags: true
          fetch-depth: 0

      - name: Verify APP_VERSION matches tag
        shell: bash
        run: |
          # 不用 grep -P：macOS 的 BSD grep 没这个 flag。改 sed，跨 Linux/macOS/Git-Bash 都行。
          TAG_VER="${GITHUB_REF_NAME#v}"
          CODE_VER=$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' core/config.py)
          if [ "$TAG_VER" != "$CODE_VER" ]; then
            echo "::error::Tag $GITHUB_REF_NAME but APP_VERSION in core/config.py is $CODE_VER — did you forget to bump?"
            exit 1
          fi
          echo "✓ Version match: $CODE_VER"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # 锁版本只为 CI 与本地环境一致、构建可复现（曾因 CI/本地版本漂移
          # 误诊过打包体积问题）。体积翻倍的真凶是 zip 不加 -y 展开 symlink，
          # 与 PyInstaller/PySide6 版本无关，升级版本前本地验证一遍即可。
          pip install "pyinstaller==6.20.0"

      - name: Download ADB (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          curl -O https://dl.google.com/android/repository/platform-tools-latest-windows.zip
          unzip platform-tools-latest-windows.zip
          mkdir -p bin/win
          cp platform-tools/adb.exe bin/win/
          cp platform-tools/AdbWinApi.dll bin/win/
          cp platform-tools/AdbWinUsbApi.dll bin/win/

      - name: Download ADB (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          curl -O https://dl.google.com/android/repository/platform-tools-latest-darwin.zip
          unzip platform-tools-latest-darwin.zip
          mkdir -p bin/mac
          cp platform-tools/adb bin/mac/
          chmod +x bin/mac/adb

      # macOS 不装 UPX：PyInstaller 在非 Windows 平台会直接禁用 UPX
      # （"known compatibility problems"，装了也是空转，PyInstaller 官方结论）。
      - name: Install UPX (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install upx -y

      # exclude 列表与 ADBHelper.spec 保持一致：PySide6 只在截图标注子进程里用到
      # QtCore/QtGui/QtWidgets，这些是子进程用不到、但 PyInstaller 的 PySide6 hook
      # 会顺带打包进来的 Qt 大件（QtQml/QtQuick 等尤其占体积）。
      - name: Build with PyInstaller (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          pyinstaller --noconsole --onefile --hidden-import win32clipboard --add-data "bin/win/adb.exe:bin/win" --add-data "bin/win/AdbWinApi.dll:bin/win" --add-data "bin/win/AdbWinUsbApi.dll:bin/win" --collect-all customtkinter --collect-all tkinterdnd2 --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest --exclude-module PySide6.QtXml --exclude-module PySide6.QtConcurrent --exclude-module PySide6.QtDBus --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtHelp --exclude-module PySide6.QtSvg --exclude-module PySide6.QtSvgWidgets --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtPrintSupport --name "ADBHelper-${{ github.ref_name }}" main.py

      - name: Build with PyInstaller (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          pyinstaller --noconsole --windowed --add-data "bin/mac/adb:bin/mac" --collect-all customtkinter --collect-all tkinterdnd2 --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick --exclude-module PySide6.QtQuickWidgets --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtOpenGLWidgets --exclude-module PySide6.QtSql --exclude-module PySide6.QtTest --exclude-module PySide6.QtXml --exclude-module PySide6.QtConcurrent --exclude-module PySide6.QtDBus --exclude-module PySide6.QtDesigner --exclude-module PySide6.QtHelp --exclude-module PySide6.QtSvg --exclude-module PySide6.QtSvgWidgets --exclude-module PySide6.QtUiTools --exclude-module PySide6.QtPrintSupport --name "ADBHelper" main.py
          cd dist
          # -y 必须加：.app 内 Resources/Frameworks 之间靠 123 个符号链接互连，
          # 不加 -y 时 zip 会把每个 symlink 展开成真实拷贝，zip 从 39MB 涨到 160MB
          #（解压后 437MB）。unzip/Finder 归档工具解压都能正常还原 symlink。
          zip -ry ADBHelper-macOS-${{ github.ref_name }}.zip ADBHelper.app

      - name: Get tag annotation
        id: tag_msg
        shell: bash
        run: |
          # actions/checkout@v4 会用 `+<sha>:refs/tags/<name>` 把 tag ref 强制指向
          # commit sha，annotated tag 退化为 lightweight，%(contents) 退化为 commit
          # message。这里强制重新拉一次 tags 把 ref 还原指向 tag object。
          git fetch --tags --force origin
          MSG=$(git tag -l --format='%(contents)' "${{ github.ref_name }}")
          echo "body<<TAGEOF" >> "$GITHUB_OUTPUT"
          echo "$MSG" >> "$GITHUB_OUTPUT"
          echo "TAGEOF" >> "$GITHUB_OUTPUT"

      - name: Upload Release Asset (Windows)
        if: matrix.os == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_msg.outputs.body }}
          files: dist/ADBHelper-${{ github.ref_name }}.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release Asset (macOS)
        if: matrix.os == 'macos-latest'
        uses: softprops/action-gh-release@v2
        with:
          body: ${{ steps.tag_msg.outputs.body }}
          files: dist/ADBHelper-macOS-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
